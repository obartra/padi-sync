[project]
name = "padi-sync"
version = "0.1.0"
description = "Fill in your PADI logbook from a Shearwater dive computer, with weather, sea conditions and GoPro footage"
requires-python = ">=3.11"
dependencies = ["playwright", "requests", "numpy", "opencv-python-headless"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
padi-sync = "padi_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padi_sync"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]   # small lambdas are clearer inline here

[tool.pytest.ini_options]
markers = ["browser: needs Playwright's Chromium (run in a separate CI job)"]
